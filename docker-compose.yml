name: releaseops

services:
  postgres:
    image: postgres:17-alpine
    container_name: releaseops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releaseops}
      POSTGRES_USER: ${POSTGRES_USER:-releaseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - releaseops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: releaseops-backend:local
    container_name: releaseops-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-releaseops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-releaseops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Colombo
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8080/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - releaseops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: releaseops-frontend:local
    container_name: releaseops-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - releaseops-network

volumes:
  postgres_data:

networks:
  releaseops-network:
    driver: bridge