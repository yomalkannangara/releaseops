name: releaseops

services:
  postgres:
    image: postgres:17-alpine
    container_name: releaseops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releaseops}
      POSTGRES_USER: ${POSTGRES_USER:-releaseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - releaseops-network

volumes:
  postgres_data:

networks:
  releaseops-network:
    driver: bridge
