name: releaseops

services:
  postgres:
    image: postgres:17-alpine
    container_name: releaseops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped
    networks:
      - releaseops-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/yomalkannangara/releaseops-backend:latest}
    container_name: releaseops-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: >-
        -Xms96m
        -Xmx256m
        -XX:MaxMetaspaceSize=128m
        -XX:+UseSerialGC
        -Duser.timezone=Asia/Colombo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8080/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 480m
    restart: unless-stopped
    networks:
      - releaseops-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/yomalkannangara/releaseops-frontend:latest}
    container_name: releaseops-frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - releaseops-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: releaseops-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 32m
    restart: unless-stopped
    networks:
      - releaseops-network

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: releaseops-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      node-exporter:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 160m
    restart: unless-stopped
    networks:
      - releaseops-network

  grafana:
    image: grafana/grafana:12.3.6
    container_name: releaseops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: releaseops-yk.duckdns.org
      GF_SERVER_ROOT_URL: https://releaseops-yk.duckdns.org/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/grafana/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    mem_limit: 192m
    restart: unless-stopped
    networks:
      - releaseops-network

  caddy:
    image: caddy:2-alpine
    container_name: releaseops-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      grafana:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - releaseops-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
    name: releaseops_grafana_data_v12
  caddy_data:
  caddy_config:

networks:
  releaseops-network:
    driver: bridge
