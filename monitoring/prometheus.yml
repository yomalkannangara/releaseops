global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: releaseops-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080
  - job_name: releaseops-host
    static_configs:
      - targets:
          - node-exporter:9100